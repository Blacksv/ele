<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffdce9">
  <title>🍓</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", Arial, sans-serif;
      background: linear-gradient(145deg, #ffd7e6 0%, #fff0f5 48%, #f5dcff 100%);
      color: #351827;
    }

    .hearts {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      animation: floatUp linear forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: .65;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
      }
    }

    .page {
      position: fixed;
      inset: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transition: opacity .45s ease, transform .45s ease;
    }

    .page.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-25px);
    }

    .page.next {
      transform: translateX(25px);
    }

    .page.next.active {
      transform: translateX(0);
    }

    .card {
      width: min(100%, 520px);
      max-height: calc(100dvh - 48px);
      overflow: auto;
      padding: clamp(30px, 8vw, 52px) clamp(22px, 7vw, 40px);
      text-align: center;
      background: rgba(255, 255, 255, .84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(126, 54, 91, .18);
      scrollbar-width: none;
    }

    .card::-webkit-scrollbar {
      display: none;
    }

    .strawberry {
      font-size: clamp(45px, 14vw, 70px);
      margin-bottom: 8px;
      animation: pulse 1.8s infinite;
    }

    .heart-icon {
      font-size: clamp(45px, 14vw, 70px);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
      }
    }

    h1 {
      margin: 10px 0 18px;
      font-size: clamp(27px, 8vw, 45px);
      line-height: 1.12;
      letter-spacing: -0.7px;
    }

    p {
      margin: 0 auto;
      max-width: 430px;
      font-size: clamp(17px, 4.7vw, 20px);
      line-height: 1.55;
    }

    .continue {
      margin-top: 30px;
      padding: 15px 28px;
      border: 0;
      border-radius: 999px;
      background: #ff6d9d;
      color: white;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(255, 109, 157, .28);
      cursor: pointer;
    }

    .question {
      margin-top: 26px;
    }

    .question h1 {
      font-size: clamp(28px, 8vw, 44px);
      color: #ff4f88;
    }

    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      margin-top: 28px;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
    }

    .yes, .no {
      border: 0;
      border-radius: 999px;
      padding: 15px 28px;
      min-width: 105px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .yes {
      background: #ff5f91;
      color: white;
      box-shadow: 0 8px 22px rgba(255, 95, 145, .3);
    }

    .yes:active {
      transform: scale(.96);
    }

    .no {
      background: #eeeeee;
      color: #555;
      position: relative;
    }

    .final {
      display: none;
    }

    .final h1 {
      color: #ff4f88;
    }

    @media (max-height: 650px) {
      .page {
        padding: 14px;
      }

      .card {
        max-height: calc(100dvh - 28px);
        padding-top: 24px;
        padding-bottom: 24px;
        border-radius: 24px;
      }

      .strawberry,
      .heart-icon {
        font-size: 45px;
      }

      h1 {
        margin-bottom: 12px;
      }

      .continue {
        margin-top: 20px;
      }

      .question {
        margin-top: 15px;
      }

      .buttons {
        margin-top: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="hearts" id="hearts"></div>

  <!-- PAGINA 1 -->
  <section class="page" id="page1">
    <div class="card">
      <div class="strawberry">🍓</div>

      <h1>ciao ele🍓,</h1>

      <p>
        per farmi perdonare ti volevo chiedere una cosa...
      </p>

      <button class="continue" id="continueBtn">
        continua 
      </button>
    </div>
  </section>

  <!-- PAGINA 2 -->
  <section class="page next hidden" id="page2">
    <div class="card">
      <div class="heart-icon">🍓</div>


      <div class="question">
        <h1>Vuoi essere la mia ragazza? 🥺</h1>
      </div>

      <div class="buttons">
        <button class="yes" id="yes">Sì 🍓</button>
        <button class="no" id="no">No 😔</button>
      </div>

      <p>
        Non essere misteriosa pls😖!
      </p>
    </div>
  </section>

  <!-- PAGINA FINALE -->
  <section class="page next hidden" id="finalPage">
    <div class="card">
      <div class="heart-icon">🍉</div>

      <h1>GODO!😁</h1>

      <p>
        Sono troppo felice di aver trovato una 
        persona bellissima e fantastica come te!
        <br><br>
        Samu🍓
      </p>

    </div>
  </section>

  <script>
    const page1 = document.getElementById("page1");
    const page2 = document.getElementById("page2");
    const finalPage = document.getElementById("finalPage");

    const continueBtn = document.getElementById("continueBtn");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");

    continueBtn.addEventListener("click", () => {
      page1.classList.add("hidden");

      setTimeout(() => {
        page1.style.display = "none";
        page2.classList.remove("hidden");
        page2.classList.add("active");
      }, 250);
    });

    function moveNoButton() {
      const padding = 12;

      const buttonWidth = noBtn.offsetWidth;
      const buttonHeight = noBtn.offsetHeight;

      const maxX = window.innerWidth - buttonWidth - padding;
      const maxY = window.innerHeight - buttonHeight - padding;

      const x = Math.max(
        padding,
        Math.random() * Math.max(padding, maxX)
      );

      const y = Math.max(
        padding,
        Math.random() * Math.max(padding, maxY)
      );

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.zIndex = "20";
    }

    // Su iPhone funziona anche al tocco
    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("click", moveNoButton);

    yesBtn.addEventListener("click", () => {
      page2.classList.add("hidden");

      setTimeout(() => {
        page2.style.display = "none";
        finalPage.style.display = "flex";
        finalPage.classList.remove("hidden");
        finalPage.classList.add("active");
        createConfetti();
      }, 250);
    });

    // Cuori sullo sfondo
    const heartsContainer = document.getElementById("hearts");

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["❤️", "💗", "💕", "💖", "🍓"]
        [Math.floor(Math.random() * 5)];

      heart.style.left = Math.random() * 100 + "%";
      heart.style.fontSize = (14 + Math.random() * 18) + "px";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";

      heartsContainer.appendChild(heart);

      setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createHeart, 600);

    function createConfetti() {
      for (let i = 0; i < 65; i++) {
        const item = document.createElement("div");

        item.textContent = ["❤️", "💗", "🥹", "🍉", "🍓"]
          [Math.floor(Math.random() * 5)];

        item.style.position = "fixed";
        item.style.left = Math.random() * 100 + "vw";
        item.style.top = "-30px";
        item.style.fontSize = (14 + Math.random() * 18) + "px";
        item.style.zIndex = "50";
        item.style.pointerEvents = "none";

        document.body.appendChild(item);

        const duration = 1500 + Math.random() * 2500;

        item.animate([
          {
            transform: "translateY(0) rotate(0deg)",
            opacity: 1
          },
          {
            transform:
              "translateY(" + (window.innerHeight + 80) +
              "px) rotate(" + (Math.random() * 720 - 360) + "deg)",
            opacity: 0
          }
        ], {
          duration: duration,
          easing: "ease-in"
        });

        setTimeout(() => item.remove(), duration);
      }
    }
  </script>

</body>
</html>
